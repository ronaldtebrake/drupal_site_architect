services:
  ai_site_advisor.context:
    class: Drupal\ai_site_advisor\Context\SiteContextCollector
    arguments: ['@entity_type.manager', '@entity_field.manager', '@module_handler', '@config.factory']
  ai_site_advisor.catalog:
    class: Drupal\ai_site_advisor\Context\RecipeCatalog
    arguments: ['%app.root%']
  ai_site_advisor.profile:
    class: Drupal\ai_site_advisor\Assessment\ContentPlanningProfile
  ai_site_advisor.decision:
    class: Drupal\ai_site_advisor\Assessment\DecisionClient
    arguments: ['@ai.provider']
  ai_site_advisor.advisor:
    class: Drupal\ai_site_advisor\Assessment\SiteAdvisor
    arguments: ['@ai_site_advisor.context', '@ai_site_advisor.catalog', '@ai_site_advisor.profile', '@ai_site_advisor.decision']
  Drupal\ai_site_advisor\Assessment\SiteAdvisorInterface:
    alias: ai_site_advisor.advisor
