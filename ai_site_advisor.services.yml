services:
  ai_site_advisor.context:
    class: Drupal\ai_site_advisor\Context\SiteContextCollector
    arguments: ['@entity_type.manager', '@entity_field.manager', '@module_handler', '@config.factory', '@extension.list.module', '@ai_site_advisor.configuration']
  ai_site_advisor.configuration:
    class: Drupal\ai_site_advisor\Context\ConfigurationInspector
    arguments: ['@entity_type.manager', '@entity_field.manager', '@extension.list.module']
  ai_site_advisor.catalog:
    class: Drupal\ai_site_advisor\Context\RecipeCatalog
    arguments: ['%app.root%', '@config.factory']
    tags:
      - { name: ai_site_advisor.catalog_source }
  ai_site_advisor.candidates:
    class: Drupal\ai_site_advisor\Context\CandidateCatalog
    tags:
      - { name: service_collector, tag: ai_site_advisor.catalog_source, call: addSource }
  ai_site_advisor.profile:
    class: Drupal\ai_site_advisor\Assessment\ContentPlanningProfile
  ai_site_advisor.decision:
    class: Drupal\ai_site_advisor\Assessment\DecisionClient
    arguments: ['@ai.provider']
  ai_site_advisor.search_planner:
    class: Drupal\ai_site_advisor\Assessment\SearchPlanner
    arguments: ['@ai_site_advisor.decision']
  ai_site_advisor.advisor:
    class: Drupal\ai_site_advisor\Assessment\SiteAdvisor
    arguments: ['@ai_site_advisor.context', '@ai_site_advisor.candidates', '@ai_site_advisor.profile', '@ai_site_advisor.decision', '@ai_site_advisor.search_planner']
  Drupal\ai_site_advisor\Assessment\SiteAdvisorInterface:
    alias: ai_site_advisor.advisor
