site_architect.settings:
  type: config_object
  label: 'Drupal Site Architect settings'
  mapping:
    site_policy:
      type: text
      label: 'Site planning policy'
    included_bundles:
      type: sequence
      label: 'Content types in scope (empty means all)'
      sequence:
        type: string
    recipe_directories:
      type: sequence
      label: 'Additional local recipe discovery roots'
      sequence:
        type: string
